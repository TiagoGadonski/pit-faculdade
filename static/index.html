<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrganizaTarefas</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap"><header><p class="eyebrow">PROJETO INTEGRADOR • ENGENHARIA DE SOFTWARE II</p><h1>OrganizaTarefas</h1><p>Cadastre, acompanhe e conclua atividades em um só lugar.</p></header>
<section class="card" aria-labelledby="titulo-form"><h2 id="titulo-form">Nova tarefa</h2><form id="form"><label for="titulo">Título *</label><input id="titulo" required maxlength="100" placeholder="Ex.: Revisar documentação"><label for="descricao">Descrição</label><textarea id="descricao" maxlength="500" rows="3" placeholder="Detalhes opcionais"></textarea><div class="actions"><button id="submit" type="submit">Adicionar tarefa</button><button id="cancelar" type="button" class="secondary" hidden>Cancelar edição</button></div></form></section>
<section aria-labelledby="lista-title"><div class="list-head"><h2 id="lista-title">Minhas tarefas</h2><select id="filtro" aria-label="Filtrar tarefas"><option value="todas">Todas</option><option value="pendentes">Pendentes</option><option value="concluidas">Concluídas</option></select></div><p id="mensagem" role="status" aria-live="polite"></p><ul id="lista" class="tasks"></ul></section></main><script src="/app.js"></script></body></html>
